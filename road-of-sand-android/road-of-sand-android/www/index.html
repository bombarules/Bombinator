<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110c">
<title>Road of Sand — Arenas of the Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bronze:#c98a2c; --sand:#e9c98b; --bone:#f3e8d2;
  --page:#110d09; --panel:#f3e8d2; --panel-text:#231c14; --panel-soft:#6b5a44; --veil:rgba(17,12,8,.74);
  --btn-text:#231c14; --pad-bg:rgba(243,232,210,.14); --pad-line:rgba(233,201,139,.6); --pad-text:#f3e8d2;
  color-scheme: light dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --panel:#221a12; --panel-text:#f3e8d2; --panel-soft:#c4b08e; --veil:rgba(12,8,5,.8);} }
:root[data-theme="dark"]{ color-scheme:dark; --panel:#221a12; --panel-text:#f3e8d2; --panel-soft:#c4b08e; --veil:rgba(12,8,5,.8); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--bone);font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#stage{position:relative;overflow:hidden;background:#000;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));display:none;align-items:center;justify-content:center;background:var(--veil);padding:14px;z-index:5}
#ov.show{display:flex}
.panel{background:var(--panel);color:var(--panel-text);border:1px solid var(--bronze);border-radius:3px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.panel h2{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(20px,3.4vw,30px);margin:0 0 6px;letter-spacing:.04em}
.panel h3{font-family:Cinzel,Georgia,serif;font-size:15px;margin:14px 0 4px}
.panel p{margin:.4em 0;line-height:1.45;font-size:16px}
.soft{color:var(--panel-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.col{display:grid;gap:8px;margin-top:12px}
button,input{font:inherit}
.btn{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.05em;padding:10px 16px;border-radius:2px;border:1.5px solid var(--bronze);background:transparent;color:inherit;cursor:pointer;min-height:44px;text-align:left}
.btn.primary{background:var(--bronze);color:var(--btn-text)}
.btn.sel{background:color-mix(in srgb,var(--bronze) 28%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;font-family:"Alegreya Sans",system-ui,sans-serif;font-weight:400;letter-spacing:0;font-size:14px;opacity:.85;margin-top:2px}
.btn:focus-visible,.pb:focus-visible,.ico:focus-visible,input:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.code{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:clamp(40px,9vw,72px);letter-spacing:.2em;text-align:center;margin:6px 0}
input.codein{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:28px;letter-spacing:.3em;text-align:center;width:9ch;padding:8px;border:1.5px solid var(--bronze);background:transparent;color:inherit;border-radius:2px}
.card{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(12px,4vh,30px);align-items:center;justify-content:center;text-align:center;padding:6% 8%;cursor:pointer;
  background:radial-gradient(60% 70% at 35% 45%, #e7a94f 0%, rgba(231,169,79,0) 70%),radial-gradient(55% 60% at 72% 60%, #b8743a 0%, rgba(184,116,58,0) 70%),radial-gradient(80% 90% at 85% 15%, #5a3a1c 0%, rgba(90,58,28,0) 70%),linear-gradient(160deg,#1d150e,#4a2e1a 55%,#1d150e);}
.card .txt{font-family:Cinzel,Georgia,serif;font-weight:700;color:#fff6df;text-shadow:0 1px 2px rgba(60,30,10,.6);font-size:clamp(15px,2.7vw,26px);line-height:1.5;max-width:30em;letter-spacing:.03em;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease}
.card.in .txt{opacity:1;transform:none}
.card .title{font-family:Cinzel,Georgia,serif;font-weight:500;color:#2a1a10;font-size:clamp(26px,min(7.5vw,13vh),88px);letter-spacing:.3em;margin-right:-.3em;white-space:nowrap;display:block;text-shadow:none}
.card .sub{display:block;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(12px,1.8vw,17px);letter-spacing:.2em;color:#3b2414;margin-top:14px}
.card .hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;font-size:13px;color:#fff1d6;opacity:.75}
.card .cardbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
.card .cardbtns .btn{background:rgba(29,21,14,.55);color:#fff6df;border-color:#f1c27a;text-align:center}
.card .cardbtns .btn.primary{background:#f1c27a;color:#2a1a10}
.map{display:block;width:100%;height:auto;max-height:30vh;margin:8px 0 4px;border:1px solid var(--bronze);border-radius:2px;background:color-mix(in srgb,var(--bronze) 8%,transparent)}
#ov.full{padding:0;background:#0c0806}
.armfull{position:absolute;inset:0;color:#f3e8d2;overflow:hidden}
.armfull #pv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer;border:0;aspect-ratio:auto;background:none}
.arm-top{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:3}
.arm-top>*{pointer-events:auto}
.arm-title h2{font-family:Cinzel,Georgia,serif;font-weight:700;margin:0;font-size:clamp(18px,3vw,28px);text-shadow:0 2px 8px #000}
.arm-title .gname{color:#e9c98b;font-size:15px;text-shadow:0 1px 4px #000}
.arm-actions{display:flex;gap:8px}
.arm-actions .btn{background:rgba(20,14,9,.7);color:#f3e8d2;min-height:40px;padding:8px 14px;text-align:center}
.arm-actions .btn.primary{background:#c98a2c;color:#231c14}
.arm-stats{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 54px);width:min(240px,44vw);background:rgba(20,14,9,.78);border:1px solid #c98a2c;border-radius:2px;padding:8px 10px;z-index:3}
.arm-stats .stat span{color:#f3e8d2}
.arm-hint{position:absolute;left:0;right:0;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 58px);text-align:center;font-size:15px;color:#e9c98b;text-shadow:0 1px 4px #000;pointer-events:none;z-index:2}
.arm-slots{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;padding:0 12px;z-index:3;-webkit-overflow-scrolling:touch}
.arm-slots .chip{flex:0 0 auto;background:rgba(20,14,9,.72);color:#f3e8d2}
.arm-slots .chip.primary{background:#c98a2c;color:#231c14}
.arm-ring{position:absolute;inset:0;pointer-events:none;z-index:4}
.ring-title{position:absolute;transform:translate(-50%,-100%);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:18px;color:#ffd9a0;text-shadow:0 2px 6px #000;white-space:nowrap}
.ring-btn{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:min(180px,44vw);min-height:44px;padding:8px 14px;border-radius:24px;border:1.5px solid #c98a2c;background:rgba(20,14,9,.82);color:#f3e8d2;font:700 14px "Alegreya Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5);text-align:left;animation:ringin .22s ease-out both}
.ring-btn small{display:block;font-weight:400;font-size:12px;opacity:.8}
.ring-btn.on{background:#c98a2c;color:#231c14;box-shadow:0 0 18px rgba(255,200,120,.55)}
.ring-btn:disabled{opacity:.35;cursor:default}
.ring-btn i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex:0 0 auto}
.ring-btn.sw-only{padding:6px;border-radius:50%}
.ring-btn.sw-only i{width:34px;height:34px}
.ring-btn:focus-visible,.arm-slots .chip:focus-visible{outline:3px solid #ffd9a0;outline-offset:2px}
@keyframes ringin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion: reduce){.ring-btn{animation:none}}
.armory{position:sticky;top:-20px;z-index:2;background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:6px 0 10px;margin:0 0 4px;border-bottom:1px solid color-mix(in srgb,var(--bronze) 40%,transparent)}
#pv{width:clamp(110px,30vw,190px);aspect-ratio:5/6;border:1px solid var(--bronze);border-radius:2px;background:radial-gradient(70% 45% at 50% 92%,#e2c28a,#b8955f 60%,#5a4632)}
.stat{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:4px 8px;font-size:13px;align-items:center;margin:3px 0}
.stat i{display:block;height:7px;background:color-mix(in srgb,var(--bronze) 22%,transparent)}
.stat i b{display:block;height:100%;background:var(--bronze);transition:width .2s}
.gname{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:16px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-family:"Alegreya Sans",system-ui,sans-serif;font-weight:700;font-size:14px;padding:7px 10px;min-height:40px;border:1.5px solid var(--bronze);border-radius:2px;background:transparent;color:inherit;cursor:pointer}
.chip.primary{background:var(--bronze);color:var(--btn-text)}
.chip:disabled{opacity:.35;cursor:default}
.chip:focus-visible,.sw:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.35);cursor:pointer;padding:0}
.sw.primary{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--bronze)}
.panel.builder{max-width:1180px;height:100%;display:flex;flex-direction:column;padding:12px 14px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.bhead h2{margin:0}
.bwrap{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;margin:8px 0 6px}
#bcv{touch-action:none;border:1px solid var(--bronze);border-radius:2px;cursor:crosshair;display:block}
.bpal{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.bpal .chip{flex:0 0 auto;text-align:left;line-height:1.15}
.bpal .chip small{display:block;font-weight:400;font-size:12px;opacity:.85}
.binfo{font-size:14px;min-height:2.6em;line-height:1.3}
.binfo b{font-family:Cinzel,Georgia,serif}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 8px;margin:6px 0 2px;-webkit-overflow-scrolling:touch}
.gallery figure{margin:0;flex:0 0 auto;width:var(--gw,150px);scroll-snap-align:start;cursor:pointer}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--bronze);border-radius:2px}
.gallery figcaption{font-size:13px;line-height:1.3;margin-top:4px}
.gallery figcaption b{font-family:Cinzel,Georgia,serif;font-size:12px;display:block}
.gallery.big{--gw:min(78%,320px)}
.era{font-size:11px;color:var(--panel-soft)}
.hero{display:block;width:100%;max-height:34vh;object-fit:cover;border:1px solid var(--bronze);border-radius:2px;margin:6px 0}
.photo-full{display:block;max-width:100%;max-height:50vh;margin:6px auto;border:1px solid var(--bronze);border-radius:2px}
.shop{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:10px}
.shop .btn{padding:8px 12px;font-size:13px;min-height:40px;text-align:center}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.gold{font-family:Cinzel,Georgia,serif;font-weight:700}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:6px}
.keys b{font-family:Cinzel,Georgia,serif}
#icons{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
.ico{width:34px;height:30px;border-radius:2px;border:1px solid rgba(233,201,139,.5);background:rgba(20,14,9,.45);color:#f3e8d2;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#roomTag{position:absolute;right:8px;bottom:8px;z-index:4;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:13px;color:#f3e8d2;background:rgba(20,14,9,.6);border:1px solid rgba(233,201,139,.5);padding:4px 8px;border-radius:2px;display:none}
body.hosting #roomTag{display:block}
#pad{display:none;position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.touch.fighting:not(.swipe):not(.tv) #pad{display:flex}
.grp{pointer-events:auto;display:grid;gap:10px}
.grp.move{grid-template-columns:auto auto}
.grp.act{grid-template-areas:". heavy roar" "block strike dodge";grid-template-columns:auto auto auto;align-items:center}
.pb{width:62px;height:62px;border-radius:50%;background:var(--pad-bg);border:2px solid var(--pad-line);color:var(--pad-text);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:12px;letter-spacing:.03em;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;justify-content:center;padding:0}
.pb.big{width:76px;height:76px;font-size:14px}
.pb.arrow{width:70px;height:70px;font-size:24px}
.pb.on{background:rgba(201,138,44,.6)}
.pb.ready{border-color:#ffd46b;box-shadow:0 0 14px rgba(255,212,107,.7)}
#swipeZone{display:none;position:absolute;inset:0;z-index:3;touch-action:none}
body.touch.fighting.swipe:not(.tv) #swipeZone{display:block}
#swipeHint{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:rgba(243,232,210,.75);pointer-events:none}
body.touch.portrait #app{justify-content:flex-start}
body.touch.portrait #pad{position:relative;display:flex;flex:1;align-items:center;padding-top:10px;background:linear-gradient(#1d150e,#110d09);justify-content:space-around;padding-left:8px;padding-right:8px}
body.touch.portrait:not(.fighting) #pad .grp, body.touch.portrait.swipe #pad .grp{visibility:hidden}
body.touch.portrait.swipe.fighting #swipeZone{display:block;position:fixed;inset:auto 0 0 0;top:var(--stageH,40%)}
body.touch.portrait .pb{width:58px;height:58px}
body.touch.portrait .pb.arrow{width:66px;height:66px}
body.touch.portrait .pb.big{width:80px;height:80px}
body.touch.portrait .grp{gap:8px}
body.touch.portrait #icons{top:auto;bottom:6px}
/* remote roles: this phone is a controller or a crowd member */
#remote{display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;width:100%}
body.remote #stage{display:none}
body.remote #remote{display:flex}
body.remote.rpad #pad{display:flex;position:relative;flex:1;width:100%;align-items:center;justify-content:space-around;pointer-events:auto}
body.remote.rpad.swipe #pad .grp{visibility:hidden}
body.remote.rpad.swipe #swipeZone{display:block;position:fixed;inset:auto 0 0 0;top:var(--remoteH,30%)}
#remote h2{font-family:Cinzel,Georgia,serif;margin:4px 0;font-size:22px}
#remote .st{font-size:15px;color:#e9c98b}
.crowdbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(420px,100%);margin-top:8px}
.crowdbtns .btn{text-align:center;font-size:22px;min-height:84px;color:#f3e8d2}
.crowdbtns .btn.cheer{grid-column:1/-1;background:#c98a2c;color:#231c14}
#toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);background:rgba(20,14,9,.85);color:#f3e8d2;border:1px solid var(--bronze);padding:6px 12px;font-size:14px;border-radius:2px;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
body.portrait #ov{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion: reduce){ .card .txt{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="remote"></div>
  <div id="stage">
    <canvas id="cv" aria-label="Arena fight"></canvas>
    <div id="icons">
      <button class="ico" id="bPause" aria-label="Pause">❚❚</button>
      <button class="ico" id="bMute" aria-label="Sound on or off">♪</button>
      <button class="ico" id="bFull" aria-label="Full screen">⤢</button>
    </div>
    <div id="roomTag"></div>
  </div>
  <div id="toast"></div>
  <div id="ov"></div>
  <div id="pad" aria-hidden="true">
    <div class="grp move">
      <button class="pb arrow" data-hold="left">◀</button>
      <button class="pb arrow" data-hold="right">▶</button>
    </div>
    <div class="grp act">
      <button class="pb" style="grid-area:heavy" data-act="heavy">Heavy</button>
      <button class="pb" style="grid-area:roar" data-act="roar" id="roarBtn">Roar</button>
      <button class="pb" style="grid-area:block" data-hold="block">Block</button>
      <button class="pb big" style="grid-area:strike" data-act="light">Strike</button>
      <button class="pb" style="grid-area:dodge" data-act="dodge">Dodge</button>
    </div>
  </div>
  <div id="swipeZone"><div id="swipeHint">Tap to strike · flick toward to strike, long flick for heavy · flick away to dodge · drag to walk · swipe down to block · flick up to roar</div></div>
</div>
<script>
(()=>{
'use strict';
let W=960,RIGHT=890;const H=540,FLOOR=452,LEFT=70;
const $=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage'),pad=$('pad'),ov=$('ov');let ctx=cv.getContext('2d');
const isTouch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
let scale=1;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

/* ================= data ================= */
const STYLES={
  murmillo:{label:'Murmillo',desc:'Sword and tall shield. The strongest guard.',chip:.12,parry:.16,blockSt:1,reachAdd:0,windMul:1,dmg:1,net:false},
  dimachaerus:{label:'Dimachaerus',desc:'Two swords, no shield. Fast flurries, wide parry window, weak guard.',chip:.35,parry:.21,blockSt:1.5,reachAdd:-4,windMul:.78,dmg:.92,net:false},
  retiarius:{label:'Retiarius',desc:'Trident and net. Longest reach. Heavy from range throws the net.',chip:.4,parry:.18,blockSt:1.6,reachAdd:34,windMul:1.08,dmg:1,net:true},
  hoplomachus:{label:'Hoplomachus',desc:'Spear and small round shield. Reach and a solid guard.',chip:.2,parry:.16,blockSt:1.2,reachAdd:20,windMul:1.04,dmg:1,net:false}
};
const GEAR={
  helmet:{label:'Helmet',opts:{galea:['Legion galea',1,4],corinthian:['Crested bronze war helm',2,6],hood:['Cloth hood',0,1],brim:['Brimmed visor',2,5],griffin:['Griffin crest',2,5],egg:['Smooth egg visor',2,6],none:['No helmet',0,0]}},

function setFighting(on){document.body.classList.toggle('fighting',on);fit()}
function styleScore(){return G.crowdEarned+G.parries*6}
function step(dt){
  if(G.slowT>0){G.slowT-=dt;G.ts=.3}else G.ts=Math.min(1,G.ts+dt*3);
  const sdt=dt*G.ts;G.clock+=sdt;
  const p=G.player,e=G.foe;
  if(G.mode==='intro'){G.introT+=dt;if(G.introT>2.3)G.mode='fight'}
  if(G.mode==='fight'){humanControl(p,IN[0]);if(e.ctrl==='p2')humanControl(e,IN[1]);else aiControl(e,p,sdt)}
  else{p.move=e.move=0;p.wantBlock=e.wantBlock=false}
  updateF(p,sdt,e);updateF(e,sdt,p);separate(p,e);
  for(const n of G.nets){n.x+=n.vx*sdt;n.life-=sdt;n.spin+=sdt*8;const t=opp(n.owner);
    if(Math.abs(n.x-t.x)<30&&n.life>0&&t.state!=='dead'&&t.state!=='yield'){
      if(t.state==='dodge'&&t.t<.26){if(!n.dodged){n.dodged=true;if(isP1(t))addCrowd(8);say('Evaded!',t.x,'#9fe0ff')}}
      else if(t.state==='block'){n.life=0;sparks(t.x+t.face*28,FLOOR-105,'#ffe7b0',8);sfx.clang()}
      else{n.life=0;t.slow=1.8;if(isP1(t))addCrowd(-4);else addCrowd(8);say('Netted!',t.x,'#9fd0e0');sfx.thud();buzz(60,.6)}}
    if(n.x<LEFT-40||n.x>RIGHT+40)n.life=0}
  G.nets=G.nets.filter(n=>n.life>0);
  for(const f of G.fx){f.x+=f.vx*sdt;f.y+=f.vy*sdt;f.vy+=(f.g||200)*sdt;f.life-=sdt;if(f.blood&&f.y>FLOOR-2&&f.vy>0){f.life=0;if(G.stains.length<90)G.stains.push({x:f.x,y:FLOOR+rand(-4,26),r:rand(2,6)})}}
  for(const l of G.limbs){if(l.ground){l.vx*=Math.pow(.05,sdt);l.vr*=Math.pow(.05,sdt)}else l.vy+=900*sdt;l.x+=l.vx*sdt;l.y+=l.vy*sdt;l.rot+=l.vr*sdt;
    if(l.y>FLOOR-6){l.y=FLOOR-6;if(Math.abs(l.vy)>120){l.vy*=-.3;l.vx*=.55;l.vr*=.5;bleed(l.x,l.y,4,0)}else{l.vy=0;l.ground=true}}
    else if(gore()&&Math.random()<.5)G.fx.push({x:l.x,y:l.y,vx:rand(-20,20),vy:rand(-20,10),life:.6,max:.6,col:'#8a1a12',r:rand(1.2,2.4),g:900,blood:true})}
  G.fx=G.fx.filter(f=>f.life>0);
  for(const t of G.texts){t.y-=40*dt;t.life-=dt}
  G.texts=G.texts.filter(t=>t.life>0);
  G.shake=Math.max(0,G.shake-dt*30);
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0}
  if(G.mode==='fight')G.crowd=Math.max(0,G.crowd-1.3*sdt);
  G.crowdExc+=(((G.mode==='over'||G.mode==='vote')?1:G.crowd/100)-G.crowdExc)*Math.min(1,dt*3);
  if(G.mode==='vote'){G.voteT+=dt;
    if(G.voteT>=3.6&&!G.vote){const sp=spectatorVotes();const foeDown=G.winner==='player';
      const score=styleScore()+25*(sp.up-sp.down);const need=foeDown?55:40;
      G.vote={up:score>=need,sp};sfx.crowd(1);
      if(foeDown){if(G.vote.up){say('Missio! '+G.foe.name+' is spared',W/2,'#ffd46b',26)}else{say('Thumbs down',W/2,'#e0483a',30);finisher(G.player,G.foe)}}
      else{say(G.vote.up?'The crowd spares you':'The crowd turns away',W/2,G.vote.up?'#ffd46b':'#e0483a',26);if(!G.vote.up)finisher(G.foe,G.player)}

}
function endFight(){
  hostState({phase:'menu'});
  const R=G.R;

    panel(`<h2>${w} wins</h2><p class="soft">${R.town}</p><div class="row"><button class="btn primary" id="go">Rematch</button><button class="btn" id="sw">Change gladiators</button><button class="btn" id="back">Back to the road</button></div>`);
    ov.querySelector('#go').onclick=()=>startFight('versus',G.lastVersus);ov.querySelector('#sw').onclick=showVersus;ov.querySelector('#back').onclick=showMap;return}
  if(G.kind==='exhibition'){const v=G.vote||{up:false},won=G.winner==='player',pay=won?30+Math.floor(G.crowdEarned/4)+(v.up?10:0):10;G.gold+=pay;G.flags.home=G.flags.home||{};G.flags.home[G.stage]=true;save();

    ov.querySelector('#go').onclick=showMap;return}
  if(G.kind==='bandit'){
    if(G.winner==='player'){G.gold+=30;save();panel(`<h2>The bandits scatter</h2><p>You take their purse: <span class="gold">30 denarii</span>.</p><div class="row"><button class="btn primary" id="go">Continue to ${ROUTE[G.stage].town}</button></div>`)}
    else{const lost=Math.min(G.gold,25);G.gold-=lost;save();panel(`<h2>Robbed on the road</h2><p>You wake in a ditch, ${lost} denarii lighter.</p><div class="row"><button class="btn primary" id="go">Continue to ${ROUTE[G.stage].town}</button></div>`)}
    ov.querySelector('#go').onclick=showMap;return}
  const v=G.vote||{up:false};
  if(G.winner==='player'){
    const foe=G.foe;
    const rec=G.flags.record||(G.flags.record={wins:0,kills:0});const recBonus=6*rec.wins+10*rec.kills;const killed=G.deathFight||!v.up;
    if(G.deathFight){G.flags.fame++}else if(v.up){G.flags.fame++;G.flags.spared[foe.id]=true}else G.flags.cruel++;

    const bonus=Math.floor(G.crowdEarned/4),flawless=G.dmgTaken<1?30:0,verdictBonus=v.up&&!G.deathFight?20:0,purse=R.purse+bonus+flawless+verdictBonus+recBonus;
    const rent=townRent(G.town);G.gold+=purse+rent;G.stage++;save();
    const last=G.stage>=ROUTE.length;
    const line=G.deathFight?`Sine missione. ${foe.name} falls and will not rise. The emperor got the blood he wanted, and the crowd got a legend.`:v.up?`The crowd loved your fighting and granted ${foe.name} missio. ${foe.name} will remember the mercy.`:`The fight bored them. Thumbs down, and the editor ends it. The crowd will expect more cruelty from you now.`;
    panel(`<h2>Victory at ${R.town}</h2><p>${line}</p>
      <p class="soft">Purse ${R.purse} + crowd ${bonus}${verdictBonus?' + mercy bonus 20':''}${recBonus?' + gold and silver for your record '+recBonus:''}${flawless?' + untouched 30':''} = <span class="gold">${purse} denarii</span>${rent?` · Your town paid <span class="gold">${rent} denarii</span> in rent`:''}</p>
      <p class="soft">Record: ${rec.wins} wins, ${rec.kills} to the death · Fame ${G.flags.fame} · Cruelty ${G.flags.cruel}</p>
      <div class="row"><button class="btn primary" id="go">${last?'Claim your freedom':'Back on the road'}</button></div>`);
    ov.querySelector('#go').onclick=()=>last?showEnding():showEvent();

    const lost=v.up?0:Math.min(G.gold,20);G.gold-=lost;save();

      <p class="soft">${R.tip}</p>
      <div class="row"><button class="btn primary" id="go">Fight again</button><button class="btn" id="map">Road map</button></div>`);
    ov.querySelector('#go').onclick=()=>startFight('story');ov.querySelector('#map').onclick=showMap;
  }
}
function showEnding(){
  const f=G.flags,sparedNames=Object.keys(f.spared).map(k=>FOES[k]?FOES[k].name:k).filter(n=>n!=='Corvus');
  const cards=[];
  if(f.cruel>=2)cards.push('The crowd roars for you, the way it would roar for a lion. The editor places the rudis in your hand, the wooden sword, without a word of praise.');
  else cards.push('The crowd rises as one. The editor walks onto the sand and places the rudis in your hand: the wooden sword. Rome will tell stories about this day.');
  if(sparedNames.length)cards.push(sparedNames.join(' and ')+(sparedNames.length>1?' watch':' watches')+' from the stands. The mercy you were shown, you passed on.');
  cards.push(f.cruel>=2?'You are free. But the arena made you something you will have to unlearn on the long road home.':'You are free. The road behind you runs back to the frontier. The road ahead is yours to choose.');

}

function metal(x0,y0,x1,y1,base){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,shade(base,.45));g.addColorStop(.45,base);g.addColorStop(1,shade(base,-.45));return g}

function drawFighter(f){
  const L=f.look,fl=f.flash>0,C=c=>fl?'#ffffff':c,skin=C(f.skin),skinD=C(shade(f.skin,-.25)),B=BUILDS[L.build||'athletic']||BUILDS.athletic;

    case 'rec':{const k=Math.min(1,f.t/((f.atk&&f.atk.rec)||.3));if(stab){arm=-.1;thrust=38*(1-k)}else arm=.7-1.25*k;lean=.16*(1-k);break}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);

  const R=G.R;ctx.save();
  if(G.shake>0)ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  drawArena(R);
  for(const st of G.stains){ctx.fillStyle='rgba(110,18,12,.55)';ctx.beginPath();ctx.ellipse(st.x,st.y,st.r*1.8,st.r*.6,0,0,7);ctx.fill()}
  for(const l of G.limbs)drawLimbPiece(l);
  const order=[G.foe,G.player].sort((a,b)=>((a.state==='dead'||a.state==='yield')?0:1)-((b.state==='dead'||b.state==='yield')?0:1));
  for(const f of order)drawFighter(f);
  for(const n of G.nets)drawNet(n);
  for(const f of G.fx){ctx.globalAlpha=clamp(f.life/f.max,0,1);ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.textAlign='center';

  ctx.globalAlpha=1;ctx.restore();
  drawHUD();
  if(G.mode==='intro'){
    const k=G.introT;ctx.fillStyle='rgba(20,14,9,'+(k<1.8?.55:.55*(1-(k-1.8)/.5))+')';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
    if(k<1.8){ctx.globalAlpha=Math.min(1,k*2);ctx.font='700 54px '+FONT_D;ctx.fillStyle='#fff1d6';ctx.fillText(R.town,W/2,H/2-18);
      ctx.font='700 18px '+FONT_D;ctx.fillStyle='#e9c98b';ctx.fillText(G.kind==='versus'?'Player 1 versus Player 2':G.foe.name+', '+G.foe.title,W/2,H/2+20);

      if(G.deathFight){ctx.font='900 22px '+FONT_D;ctx.fillStyle='#e0483a';ctx.fillText('To the death',W/2,H/2+84)}}
    else{ctx.globalAlpha=1-(k-1.8)/.5;ctx.font='900 80px '+FONT_D;ctx.fillStyle='#ffd46b';ctx.fillText('Fight',W/2,H/2+20)}
    ctx.globalAlpha=1;
  }
  if(G.mode==='vote'){ctx.textAlign='center';ctx.font='900 30px '+FONT_D;ctx.lineWidth=5;ctx.strokeStyle='rgba(20,14,9,.85)';
    const t=G.vote?'':(G.winner==='player'?G.foe.name+' raises a finger for mercy':'You raise a finger for mercy');
    if(t){ctx.strokeText(t,W/2,130);ctx.fillStyle='#f3e8d2';ctx.fillText(t,W/2,130);ctx.font='700 18px '+FONT_D;const s='The crowd decides…';ctx.strokeText(s,W/2,160);ctx.fillStyle='#e9c98b';ctx.fillText(s,W/2,160)}
    const sp=spectatorVotes();if(sp.n){ctx.font='700 15px '+FONT_B;ctx.fillStyle='#f3e8d2';ctx.fillText('Spectators: '+sp.up+' up · '+sp.down+' down',W/2,186)}}

function hashStr(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const TOOL_ORDER=['road','house','insula','wall','gate','garden','fountain','aqueduct','market','temple','forum','baths','ludus','amphitheater','circus','mausoleum'];
function makeTerrain(cols,rows,seed,river,parks){
  const r=rng(seed),t=new Array(cols*rows).fill('.');
  if(river){let x=Math.round(cols*.38);for(let y=0;y<rows;y++){t[y*cols+x]='~';const d=r();if(d<.28&&x>2){x--;t[y*cols+x]='~'}else if(d>.72&&x<cols-3){x++;t[y*cols+x]='~'}}}
  for(let k=0;k<(parks==null?3:parks);k++){const cx=Math.floor(r()*cols),cy=Math.floor(r()*rows),rad=1+r()*1.5;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(Math.hypot(x-cx,y-cy)<rad&&t[y*cols+x]==='.')t[y*cols+x]='p'}
  return t.join('');
}
function townOcc(t){const o=new Array(t.cols*t.rows).fill(-1);t.b.forEach((b,i)=>{const d=BLD[b.k];for(let y=b.y;y<b.y+d.h;y++)for(let x=b.x;x<b.x+d.w;x++)o[y*t.cols+x]=i});return o}
function canPlace(t,k,x,y,occ){const d=BLD[k];if(x<0||y<0||x+d.w>t.cols||y+d.h>t.rows)return 'edge';
  for(let j=y;j<y+d.h;j++)for(let i=x;i<x+d.w;i++){if(occ[j*t.cols+i]>=0)return 'blocked';if(t.ter[j*t.cols+i]==='~'&&!d.water)return 'water'}return ''}
function townPlace(t,k,x,y){const occ=townOcc(t);if(canPlace(t,k,x,y,occ))return false;t.b.push({k,x,y});return true}
function townCount(t,k){return t?t.b.filter(b=>b.k===k).length:0}
function townPop(t){return t?t.b.reduce((n,b)=>n+(BLD[b.k].pop||0),0):0}
function townRent(t){if(!t)return 0;const m=1+.15*Math.min(3,townCount(t,'market'))+.05*Math.min(6,Math.floor(townCount(t,'wall')/6))+(townCount(t,'forum')?.1:0)+(townCount(t,'circus')?.2:0);return Math.round(townPop(t)*.6*m)}
function newHomeTown(){

}
function romeTemplate(){

  const park=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(ter[y*cols+x]==='.')ter[y*cols+x]='p'};
  park(13,0,17,1);park(0,0,3,2);park(17,12,19,13);

  const P=(k,x,y)=>townPlace(t,k,x,y),line=(k,x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)P(k,x,y)};
  P('mausoleum',4,4);P('temple',9,6);P('forum',11,8);P('amphitheater',14,8);P('ludus',17,8);P('circus',9,11);P('baths',15,11);P('temple',9,9);

  line('aqueduct',16,5,19,5);P('fountain',15,5);P('market',14,11);P('fountain',14,12);P('garden',16,7);P('garden',4,3);P('garden',5,3);
  for(let y=1;y<6;y++)for(let x=9;x<19;x++){if(x===11)continue;P(((x*7+y*3)%5===0)?'house':'insula',x,y)}

/* drawing the town: top-down, illustrated-map style */
function drawTown(c,t,T,ghost){
  const cols=t.cols,rows=t.rows,occ=townOcc(t);
  c.fillStyle='#eadcb6';c.fillRect(0,0,cols*T,rows*T);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ch=t.ter[y*cols+x],px=x*T,py=y*T,h=cellHash(x,y);
    if(ch==='p'){c.fillStyle='#b5cc86';c.fillRect(px,py,T,T)}
    else if(ch==='.'){c.fillStyle='rgba(150,120,70,.07)';if(h%3===0)c.fillRect(px+(h%7)*T/8,py+((h>>4)%7)*T/8,T/10,T/14)}}
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(t.ter[y*cols+x]!=='~')continue;const px=x*T,py=y*T;
    c.fillStyle='#8fbfd6';c.fillRect(px,py,T,T);c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=Math.max(1,T/22);
    c.beginPath();c.moveTo(px+T*.15,py+T*.35);c.quadraticCurveTo(px+T*.35,py+T*.25,px+T*.55,py+T*.35);c.moveTo(px+T*.45,py+T*.7);c.quadraticCurveTo(px+T*.65,py+T*.6,px+T*.85,py+T*.7);c.stroke();
    c.strokeStyle='#6c9db6';c.lineWidth=Math.max(1,T/16);const w=(i,j)=>i<0||j<0||i>=cols||j>=rows||t.ter[j*cols+i]==='~';
    c.beginPath();if(!w(x-1,y)){c.moveTo(px,py);c.lineTo(px,py+T)}if(!w(x+1,y)){c.moveTo(px+T,py);c.lineTo(px+T,py+T)}if(!w(x,y-1)){c.moveTo(px,py);c.lineTo(px+T,py)}if(!w(x,y+1)){c.moveTo(px,py+T);c.lineTo(px+T,py+T)}c.stroke()}
  const at=(x,y)=>{if(x<0||y<0||x>=cols||y>=rows)return null;const i=occ[y*cols+x];return i>=0?t.b[i].k:null};
  const flat=t.b.filter(b=>b.k==='road'||b.k==='wall'||b.k==='aqueduct'||b.k==='gate');
  for(const b of flat.filter(b=>b.k==='road'))drawRoad(c,b,T,at);
  const tall=t.b.filter(b=>!(b.k==='road')).sort((a,b)=>(a.y+BLD[a.k].h)-(b.y+BLD[b.k].h)||a.x-b.x);
  for(const b of tall){const px=b.x*T,py=b.y*T;const f=TDRAW[b.k];if(f)f(c,px,py,T,b,at)}
  if(ghost){const d=BLD[ghost.k]||{w:1,h:1};c.fillStyle=ghost.ok?'rgba(80,170,90,.35)':'rgba(200,60,40,.35)';c.strokeStyle=ghost.ok?'#3d8a4a':'#b8402a';c.lineWidth=2;c.fillRect(ghost.x*T,ghost.y*T,d.w*T,d.h*T);c.strokeRect(ghost.x*T+1,ghost.y*T+1,d.w*T-2,d.h*T-2)}
}
function drawRoad(c,b,T,at){
  const px=b.x*T,py=b.y*T,cx=px+T/2,cy=py+T/2,rw=T*.44,link=k=>k==='road'||k==='gate';

  const arms=[[0,-1],[1,0],[0,1],[-1,0]].filter(([dx,dy])=>link(at(b.x+dx,b.y+dy)));
  for(const [dx,dy] of arms){if(dx)c.fillRect(dx>0?cx:px,cy-rw/2-1,T/2,rw+2);else c.fillRect(cx-rw/2-1,dy>0?cy:py,rw+2,T/2)}

function linkArms(b,at,ks){return[[0,-1],[1,0],[0,1],[-1,0]].filter(([dx,dy])=>ks.includes(at(b.x+dx,b.y+dy)))}

/* builder screen */
let BT=null;
function showBuilder(mode,back){
  setFighting(false);G.mode='menu';
  const town=mode==='story'?(G.town||(G.town=newHomeTown())):loadSandbox();
  BT={town,mode,tool:'house',back,down:false,ghost:null,msg:''};
  ov.innerHTML=`<div class="panel builder">
   <div class="bhead"><h2>${mode==='story'?'Your town':'Build a town'}</h2><span id="bstats" class="soft"></span></div>
   <div class="bwrap" id="bwrap"><canvas id="bcv"></canvas></div>
   <div id="binfo" class="binfo"></div>
   <div class="chips bpal" id="bpal"></div>
   <div class="row" style="margin-top:6px">${mode==='sandbox'?'<button class="btn" id="tRome">Rome, 180 AD</button><button class="btn" id="tRiver">River valley</button><button class="btn" id="tEmpty">Open land</button>':''}<button class="btn primary" id="bdone">Done</button></div></div>`;
  ov.classList.add('show');
  const cvb=$('bcv');
  const cell=e=>{const r=cvb.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)/r.width*BT.town.cols),y:Math.floor((e.clientY-r.top)/r.height*BT.town.rows)}};
  cvb.addEventListener('pointerdown',e=>{e.preventDefault();audio();BT.down=true;try{cvb.setPointerCapture(e.pointerId)}catch(_){}const p=cell(e);BT.last=p.x+','+p.y;applyTool(p.x,p.y,true)});
  cvb.addEventListener('pointermove',e=>{const p=cell(e);
    if(BT.down&&BT.tool!=='demolish'&&BLD[BT.tool].paint){const key=p.x+','+p.y;if(key!==BT.last){BT.last=key;applyTool(p.x,p.y,false)}}
    else if(BT.down&&BT.tool==='demolish'){const key=p.x+','+p.y;if(key!==BT.last){BT.last=key;applyTool(p.x,p.y,false)}}
    if(e.pointerType==='mouse'){BT.ghost=p;renderBuilder()}});
  const up=()=>{BT.down=false};cvb.addEventListener('pointerup',up);cvb.addEventListener('pointercancel',up);
  cvb.addEventListener('pointerleave',()=>{BT.ghost=null;renderBuilder()});
  $('bdone').onclick=()=>{if(BT.mode==='story')save();else saveSandbox(BT.town);const b=BT.back;BT=null;b()};
  if(mode==='sandbox'){$('tRome').onclick=()=>{BT.town=romeTemplate();saveSandbox(BT.town);fitBuilder()};$('tRiver').onclick=()=>{BT.town=riverValley();saveSandbox(BT.town);fitBuilder()};$('tEmpty').onclick=()=>{BT.town=emptyLand();saveSandbox(BT.town);fitBuilder()}}
  renderPalette();fitBuilder();
}
function renderPalette(){
  const story=BT.mode==='story',pal=$('bpal');
  pal.innerHTML=TOOL_ORDER.map(k=>{const d=BLD[k],poor=story&&G.gold<d.cost;return `<button class="chip${BT.tool===k?' primary':''}" data-tool="${k}" ${poor?'disabled':''}>${d.name}${story?`<small>${d.cost} denarii</small>`:`<small>${d.w}×${d.h}</small>`}</button>`}).join('')
    +`<button class="chip${BT.tool==='demolish'?' primary':''}" data-tool="demolish">Clear<small>${story?'half refund':'remove'}</small></button>`;
  pal.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{BT.tool=b.dataset.tool;BT.msg='';renderPalette();renderInfo()});
  renderInfo();
}
function renderInfo(){
  const t=BT.town,story=BT.mode==='story';
  const eff=[];if(townCount(t,'temple'))eff.push('crowd +'+10*Math.min(2,townCount(t,'temple')));if(townCount(t,'baths'))eff.push('+15 health');if(townCount(t,'ludus'))eff.push('shop −25%');if(townCount(t,'amphitheater'))eff.push('home games');
  $('bstats').textContent=(story?'Purse '+G.gold+' denarii · ':'')+'People '+townPop(t)+(story?' · Rent per victory '+townRent(t)+' denarii':'')+(story&&eff.length?' · '+eff.join(', '):'')+(story?'':' · '+(t.name||''));
  const d=BLD[BT.tool];
  const tip=(innerHeight>innerWidth&&isTouch)?' <span class="soft">Turn your phone sideways for a bigger map.</span>':'';
  $('binfo').innerHTML=BT.msg?`<span style="color:#c8402e">${BT.msg}</span>`:BT.tool==='demolish'?'<b>Clear</b> · Tap a building to remove it.':`<b>${d.name}</b> · ${d.desc}${d.paint?' Drag to lay several.':''}`+tip;
}
function applyTool(x,y,first){
  const t=BT.town,story=BT.mode==='story';
  if(x<0||y<0||x>=t.cols||y>=t.rows)return;
  if(BT.tool==='demolish'){const occ=townOcc(t),i=occ[y*t.cols+x];if(i<0)return;const b=t.b[i];if(story)G.gold+=Math.floor(BLD[b.k].cost/2);t.b.splice(i,1);sfx.step();BT.msg='';afterEdit();return}
  const d=BLD[BT.tool];
  if(story&&G.gold<d.cost){if(first){BT.msg='Not enough denarii. Win fights to earn more.';renderInfo()}return}
  const why=canPlace(t,BT.tool,x,y,townOcc(t));
  if(why){if(first){BT.msg=why==='water'?'That can’t be built on the river. Roads and aqueducts can cross it.':why==='edge'?'Not enough room at the edge of the map.':'Something is already there. Use Clear first.';renderInfo()}return}
  t.b.push({k:BT.tool,x,y});if(story)G.gold-=d.cost;BT.msg='';sfx.clang();afterEdit();
}
function afterEdit(){if(BT.mode==='story')save();else saveSandbox(BT.town);renderPalette();renderBuilder()}
function fitBuilder(){
  if(!BT)return;const wrap=$('bwrap'),cvb=$('bcv');if(!wrap||!cvb)return;
  const r=wrap.getBoundingClientRect(),t=BT.town,T=Math.max(10,Math.floor(Math.min(r.width/t.cols,r.height/t.rows)));
  cvb.style.width=t.cols*T+'px';cvb.style.height=t.rows*T+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);cvb.width=t.cols*T*dpr;cvb.height=t.rows*T*dpr;BT.T=T;BT.dpr=dpr;renderBuilder();renderInfo();
}
function renderBuilder(){
  if(!BT)return;const cvb=$('bcv');if(!cvb)return;const c=cvb.getContext('2d');c.setTransform(BT.dpr,0,0,BT.dpr,0,0);
  let ghost=null;if(BT.ghost&&BT.tool!=='demolish'){const why=canPlace(BT.town,BT.tool,BT.ghost.x,BT.ghost.y,townOcc(BT.town));ghost={k:BT.tool,x:BT.ghost.x,y:BT.ghost.y,ok:!why&&!(BT.mode==='story'&&G.gold<BLD[BT.tool].cost)}}
  drawTown(c,BT.town,BT.T,ghost);
}

/* arena skylines: houses, temples, walls and aqueducts beyond the stands */
function drawSkyline(R,base){
  const r=rng(hashStr(R.town||'arena')),far=shade(R.sky[1],-.12),sil=shade(R.sky[1],-.34),lit='rgba(255,214,150,.35)';
  ctx.fillStyle=far;for(let i=0;i<5;i++){const cx=r()*W,rw=160+r()*240,rh=26+r()*36;ctx.beginPath();ctx.ellipse(cx,base,rw,rh,0,Math.PI,0);ctx.fill()}
  let x=-10;
  while(x<W+20){const t=r();ctx.fillStyle=sil;
    if(R.style==='camp'){
      if(t<.3){const w=24,h=38+r()*16;ctx.fillRect(x,base-h,w,h);for(let k=0;k<3;k++)ctx.fillRect(x+k*9,base-h-6,6,6);ctx.fillStyle=lit;ctx.fillRect(x+9,base-h+10,5,7);x+=w+4}
      else if(t<.62){const w=40+r()*16;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+w/2,base-22-r()*8);ctx.lineTo(x+w,base);ctx.fill();x+=w+4}
      else{const n=5+Math.floor(r()*5);for(let k=0;k<n;k++){ctx.beginPath();ctx.moveTo(x+k*7,base);ctx.lineTo(x+k*7,base-22);ctx.lineTo(x+k*7+3.5,base-27);ctx.lineTo(x+k*7+7,base-22);ctx.lineTo(x+k*7+7,base);ctx.fill()}x+=n*7}
    }else{
      if(t<.12){const w=56+r()*30,h=22;ctx.fillRect(x,base-8,w,8);for(let k=0;k<6;k++)ctx.fillRect(x+4+k*(w-12)/5,base-8-h,5,h);ctx.beginPath();ctx.moveTo(x-3,base-8-h);ctx.lineTo(x+w/2,base-8-h-15);ctx.lineTo(x+w+3,base-8-h);ctx.fill();x+=w+8}
      else if(t<.2){const w=110+r()*90,h=30+r()*10;ctx.fillRect(x,base-h,w,7);for(let a=0;a<w;a+=17)ctx.fillRect(x+a,base-h,5,h);x+=w+6}
      else if(t<.34){ctx.beginPath();ctx.ellipse(x+5,base-20,5,20,0,0,7);ctx.fill();ctx.fillRect(x+18,base-24,3,24);ctx.beginPath();ctx.ellipse(x+19,base-28,15,6,0,0,7);ctx.fill();x+=40}
      else if(t<.4&&(R.style==='grand'||R.home)){ctx.beginPath();ctx.arc(x+24,base-24,20,Math.PI,0);ctx.fill();ctx.fillRect(x+2,base-24,44,24);x+=54}
      else if(t<.48){const w=20,h=36+r()*14;ctx.fillRect(x,base-h,w,h);for(let k=0;k<3;k++)ctx.fillRect(x+k*7,base-h-5,5,5);ctx.fillRect(x+w,base-16,30,16);for(let k=0;k<4;k++)ctx.fillRect(x+w+k*8,base-20,5,4);x+=w+34}
      else{const w=20+r()*30,h=12+r()*26;ctx.fillRect(x,base-h,w,h);ctx.beginPath();ctx.moveTo(x-3,base-h);ctx.lineTo(x+w/2,base-h-9);ctx.lineTo(x+w+3,base-h);ctx.fill();
        if(r()<.5){ctx.fillStyle=lit;ctx.fillRect(x+w*.3,base-h+5,4,5)}x+=w+2+r()*6}
    }
  }
}

try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('room').then(r=>{lobby=r}).catch(()=>{})}catch(e){}
function showLink(back){
  if(!lobby){panel(`<h2>Link devices</h2><p>Linking needs the game open in Claude while signed in. Everyone who joins needs access to this game: share it with them from the Share menu.</p><p class="soft">Without linking you can still cast this screen to a TV and pair Bluetooth controllers. Two controllers give you versus mode.</p><div class="row"><button class="btn primary" id="back">Back</button></div>`);ov.querySelector('#back').onclick=back;return}
  if(rrole==='host'){showHostPanel(back);return}
  panel(`<h2>Link devices</h2><p class="soft">One device shows the arena (a laptop or a TV through casting). Phones join it with a code.</p>
   <div class="col"><button class="btn primary" id="host">Use this screen as the arena<small>Shows a 4-digit code. Best on a TV, laptop or tablet.</small></button>
   <button class="btn" id="pad">Use this phone as a controller<small>Player 1, or Player 2 in versus.</small></button>
   <button class="btn" id="crowd">Join the crowd<small>For spectators and stream viewers: cheer, and vote thumbs up or down.</small></button>
   <button class="btn" id="back">Back</button></div>`);
  ov.querySelector('#host').onclick=()=>startHost(back);
  ov.querySelector('#pad').onclick=()=>askCode('pad',back);
  ov.querySelector('#crowd').onclick=()=>askCode('crowd',back);
  ov.querySelector('#back').onclick=back;
}
async function startHost(back){
  roomCode=String(1000+Math.floor(Math.random()*9000));
  try{room=await lobby.join('arena-'+roomCode)}catch(e){panel(`<h2>Couldn’t open the arena</h2><p>${e&&e.code==='not_permitted'?'Linking isn’t available for this account here.':'The connection didn’t answer. Try again in a moment.'}</p><div class="row"><button class="btn primary" id="back">Back</button></div>`);ov.querySelector('#back').onclick=back;return}
  rrole='host';document.body.classList.add('hosting');$('roomTag').textContent='Arena code '+roomCode;
  room.presence(hostP);room.onPeers(()=>{if(ov.querySelector('#hostlist'))renderHostList()});
  showHostPanel(back);
}
function showHostPanel(back){
  panel(`<h2>Arena code</h2><div class="code">${roomCode}</div><p class="soft" style="text-align:center">On each phone, open this game, tap Link devices, and enter the code.</p>
   <div id="hostlist"></div>
   <div class="row"><button class="btn primary" id="back">Done</button><button class="btn" id="tv">${document.body.classList.contains('tv')?'Show touch controls':'TV mode: hide touch controls'}</button><button class="btn" id="stop">Stop linking</button></div>`);
  renderHostList();
  ov.querySelector('#back').onclick=back;
  ov.querySelector('#tv').onclick=()=>{document.body.classList.toggle('tv');showHostPanel(back)};
  ov.querySelector('#stop').onclick=async()=>{try{await room.leave()}catch(e){}room=null;rrole=null;document.body.classList.remove('hosting','tv');back()};
}
function renderHostList(){const el=ov.querySelector('#hostlist');if(!el)return;const pads=hostPads(),crowd=hostCrowd();
  el.innerHTML=`<p>${pads.length?pads.map((p,i)=>`Controller ${i+1}: Player ${i+1}`).join(' · '):'No controllers linked yet.'}</p><p class="soft">${crowd.length} in the crowd.</p>`}
function askCode(role,back){
  panel(`<h2>${role==='pad'?'Phone controller':'Join the crowd'}</h2><p>Enter the code shown on the arena screen.</p><div class="row"><input class="codein" id="code" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Arena code"></div>
   <div class="row"><button class="btn primary" id="join">Join</button><button class="btn" id="back">Back</button></div><p class="soft" id="err"></p>`);
  const inp=ov.querySelector('#code');setTimeout(()=>inp.focus(),50);
  const go=async()=>{const c=inp.value.trim();if(!/^\d{4}$/.test(c)){ov.querySelector('#err').textContent='The code is 4 digits.';return}
    ov.querySelector('#err').textContent='Joining…';
    try{room=await lobby.join('arena-'+c)}catch(e){ov.querySelector('#err').textContent='Couldn’t join. Check the code and that the arena screen is still open.';return}
    roomCode=c;rrole=role;hideOv();enterRemote()};
  ov.querySelector('#join').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  ov.querySelector('#back').onclick=()=>showLink(back);
}
function hostPeer(){if(!room)return null;return room.peers().find(p=>p.presence&&p.presence.role==='screen'&&!p.sameTab)||null}
function hostPads(){if(!room||rrole!=='host')return[];const ps=room.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.role==='pad');
  for(const p of ps)if(!slotOrder.includes(p.peer))slotOrder.push(p.peer);slotOrder=slotOrder.filter(id=>ps.some(p=>p.peer===id));
  return slotOrder.map(id=>ps.find(p=>p.peer===id))}
function hostCrowd(){if(!room||rrole!=='host')return[];return room.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.role==='crowd')}
function hostState(patch){if(rrole!=='host'||!room)return;Object.assign(hostP,patch);room.presence(Object.assign({},hostP)).catch(()=>{})}
function hostReadPads(){
  if(rrole!=='host'||!room)return;
  const pads=hostPads(),slots={};
  pads.forEach((p,i)=>{slots[p.peer]=i+1;const pr=p.presence,t=IN[i===0||G.kind!=='versus'?0:1];
    const h=pr.h||{};t.holdL||=!!h.l;t.holdR||=!!h.r;t.holdB||=!!h.b;
    const prev=lastSeen[p.peer]||(lastSeen[p.peer]={a:Object.assign({},pr.a||{})});
    for(const k in (pr.a||{})){const n=+pr.a[k]||0,o=+prev.a[k]||0;if(n>o&&n-o<6)for(let j=0;j<n-o;j++)t.acts.push(k);prev.a[k]=n}
  });
  if(JSON.stringify(slots)!==JSON.stringify(hostP.slots))hostState({slots});
  for(const c of hostCrowd()){const n=+((c.presence||{}).cheer)||0,prev=lastSeen[c.peer]||(lastSeen[c.peer]={cheer:n});if(n>prev.cheer){cheerAcc+=Math.min(5,n-prev.cheer);prev.cheer=n}}
}
function hostTick(dt){
  if(rrole!=='host')return;
  if(cheerAcc>0&&G.mode==='fight'){const take=Math.min(cheerAcc,3*dt*10);cheerAcc-=take;addCrowd(take*1.2)}else if(G.mode!=='fight')cheerAcc=0;
  hostPresT-=dt;if(hostPresT<=0){hostPresT=.5;if(G.mode==='fight'&&G.kind==='story')hostState({crowd:Math.round(G.crowd)})}
}
function spectatorVotes(){const r={up:0,down:0,n:0};if(rrole!=='host')return r;for(const c of hostCrowd()){const p=c.presence||{};if(p.vr===G.voteRound){if(p.vote==='up')r.up++;else if(p.vote==='down')r.down++}r.n++}return r}
/* remote-phone side */
function padPresence(){if(!room||rrole!=='pad')return;room.presence({role:'pad',h:{l:touchIn.holdL,r:touchIn.holdR,b:touchIn.holdB},a:Object.assign({},remoteCounts)}).catch(()=>{})}
function enterRemote(){
  document.body.classList.add('remote',rrole==='pad'?'rpad':'rcrowd');
  const box=$('remote');
  const leave=async()=>{try{await room.leave()}catch(e){}room=null;rrole=null;document.body.classList.remove('remote','rpad','rcrowd');box.innerHTML='';fit();showTitle()};
  if(rrole==='pad'){
    box.innerHTML=`<h2>Controller</h2><div class="st" id="rst">Connecting to arena ${roomCode}…</div><div class="row" style="justify-content:center"><button class="btn" id="rsw">${swipeOn?'Use buttons':'Use swipe'}</button><button class="btn" id="rleave">Leave</button></div>`;
    padPresence();
    $('rsw').onclick=()=>{setSwipe(!swipeOn);$('rsw').textContent=swipeOn?'Use buttons':'Use swipe';fitRemote()};
  }else{
    myVote=null;
    box.innerHTML=`<h2>In the crowd</h2><div class="st" id="rst">Connecting to arena ${roomCode}…</div>
     <div class="crowdbtns"><button class="btn cheer" id="cheer">Cheer</button><button class="btn" id="vup">👍 Mercy</button><button class="btn" id="vdn">👎 No mercy</button></div>
     <p class="soft" id="vhint">Voting opens when a fighter goes down.</p><div class="row" style="justify-content:center"><button class="btn" id="rleave">Leave</button></div>`;
    room.presence({role:'crowd',cheer:0,vote:null,vr:0}).catch(()=>{});
    $('cheer').onclick=()=>{crowdCounts.cheer++;room.presence({cheer:crowdCounts.cheer}).catch(()=>{});buzz(15,.2)};
    const vote=v=>{const hp=hostPeer();const vr=hp&&hp.presence.phase==='vote'?hp.presence.vr:0;if(!vr)return;myVote=v;myVR=vr;room.presence({vote:v,vr}).catch(()=>{});renderCrowdUI()};
    $('vup').onclick=()=>vote('up');$('vdn').onclick=()=>vote('down');
  }
  $('rleave').onclick=leave;
  room.onPeers(()=>rrole==='pad'?renderPadUI():renderCrowdUI());
  fitRemote();
}
function renderPadUI(){const el=$('rst');if(!el)return;const hp=hostPeer();
  if(!hp){el.textContent='Waiting for arena '+roomCode+'…';return}
  const me=room.peers().find(p=>p.sameTab);const slot=me&&hp.presence.slots?hp.presence.slots[me.peer]:null;
  el.textContent='Connected to arena '+roomCode+(slot?' · Player '+slot:'');}
function renderCrowdUI(){const el=$('rst');if(!el)return;const hp=hostPeer();
  if(!hp){el.textContent='Waiting for arena '+roomCode+'…';return}
  const p=hp.presence||{},open=p.phase==='vote';
  el.textContent=p.phase==='fight'?`${p.town||'Arena'}: fight in progress${p.crowd!=null?' · crowd favor '+p.crowd+'%':''}`:open?`${p.who||'A fighter'} is down. Vote now!`:p.phase==='verdict'?(p.up?'Missio! Mercy granted.':'Thumbs down.'):'Waiting for the next bout.';
  $('vup').disabled=$('vdn').disabled=!open;
  $('vup').classList.toggle('primary',open&&myVote==='up'&&myVR===p.vr);$('vdn').classList.toggle('primary',open&&myVote==='down'&&myVR===p.vr);
  $('vhint').textContent=open?(myVR===p.vr&&myVote?'Vote cast. You can change it until the editor decides.':'Thumbs up for mercy, down for none.'):'Voting opens when a fighter goes down.';}
function fitRemote(){const r=$('remote').getBoundingClientRect();document.documentElement.style.setProperty('--remoteH',(r.bottom)+'px')}

/* ================= layout ================= */
function fit(){
  if(rrole==='pad'||rrole==='crowd'){fitRemote();return}
  const portrait=isTouch&&innerHeight>innerWidth;
  document.body.classList.toggle('portrait',portrait);
  const app=$('app').getBoundingClientRect();
  let availH=app.height;if(portrait)availH=Math.max(180,app.height-Math.max(240,app.height*.42));
  // borderless: in landscape the arena takes the screen's own shape, so there are no black bars
  const newW=portrait?960:clamp(Math.round(H*app.width/availH),760,1400);
  const w=Math.floor(Math.min(app.width,availH*newW/H)),h=Math.floor(w*H/newW);
  stage.style.width=w+'px';stage.style.height=h+'px';
  if(newW!==W){W=newW;RIGHT=W-70;if(G.player){for(const f of [G.player,G.foe])f.x=clamp(f.x,LEFT,RIGHT);buildCrowd(G.R)}}
  document.documentElement.style.setProperty('--stageH',(stage.getBoundingClientRect().bottom)+'px');
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=cv.width/W;
  if(!portrait&&isTouch){const sc=clamp(h/430,.72,1.15);pad.querySelectorAll('.grp').forEach(g=>{g.style.transform='scale('+sc+')';g.style.transformOrigin=g.classList.contains('move')?'left bottom':'right bottom'})}
  else pad.querySelectorAll('.grp').forEach(g=>g.style.transform='');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
fit();

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
  if(!rrole||rrole==='host'){
    gatherInput();
    if(G.mode==='intro'||G.mode==='fight'||G.mode==='over'||G.mode==='vote')step(dt);
    draw();
  }else if(rrole==='crowd'&&Math.floor(G.time*2)!==Math.floor((G.time-dt)*2))renderCrowdUI();
  else if(rrole==='pad'&&Math.floor(G.time)!==Math.floor(G.time-dt)){renderPadUI();padPresence()}
  drawPreview();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showTitle();
})();
</script>
</body>
</html>
